name: Package smoke
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" "setuptools>=77" wheel
      - if: runner.os == 'Linux'
        run: python -m pytest -q
      - if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_platform_support.py tests/test_source.py tests/test_resolver.py tests/test_mcp.py tests/test_prism_export.py tests/test_p0_workflow.py tests/test_jar_validation.py
      - run: python scripts/build_package.py
      - run: python scripts/smoke_package.py
